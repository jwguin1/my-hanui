<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="일산한의원">
  <title>일산한의원</title>

  <!-- 도장 바탕 -->
  <rect x="40" y="40" width="432" height="432" rx="56" fill="#1A1A1A"/>

  <!-- 도장 테두리 (음각 느낌) -->
  <rect x="64" y="64" width="384" height="384" rx="36"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="7"/>

  <!-- 한 -->
  <g fill="#FFFFFF">
    <!-- ㅎ : 윗점 -->
    <rect x="158" y="104" width="56" height="24" rx="4"/>
    <!-- ㅎ : 가로획 -->
    <rect x="110" y="140" width="140" height="24" rx="4"/>
    <!-- ㅏ : 세로획 -->
    <rect x="300" y="104" width="24" height="175" rx="4"/>
    <!-- ㅏ : 곁줄기 -->
    <rect x="324" y="180" width="78" height="24" rx="4"/>
    <!-- ㄴ -->
    <rect x="110" y="300" width="24" height="104" rx="4"/>
    <rect x="110" y="380" width="235" height="24" rx="4"/>
  </g>

  <!-- ㅎ : 원 -->
  <circle cx="180" cy="230" r="38" fill="none" stroke="#FFFFFF" stroke-width="22"/>
</svg>
